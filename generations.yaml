generations:
  - name: "First Generation (EH32)"
    start_year: 2022
    end_year: null
    description: "The MG4 EV (known as the MG Mulan in China) represents MG's first purpose-built electric vehicle based on parent company SAIC's new Modular Scalable Platform (MSP), designed specifically for electric vehicles. This compact hatchback features distinctive, angular styling with sharp character lines, a striking two-tone roof, and a full-width LED light bar at the rear. With a length of approximately 4.3 meters and low-slung proportions, the MG4 offers a sportier stance than typical MG models. The unique battery architecture utilizes an extremely thin (just 110mm) horizontally-mounted battery pack that enables both a low center of gravity and generous interior space. Initially offered with multiple battery options: a 51kWh Standard Range version, 64kWh Long Range version offering up to 281 miles (WLTP), and later a 77kWh Extended Range version. The electric motor is mounted at the rear, making the MG4 MG's first rear-wheel drive passenger car in decades, producing either 168 horsepower in the standard version or 201 horsepower in the long-range variant. The high-performance XPower variant was introduced in July 2023 with dual motors, all-wheel drive, and 429 horsepower, capable of 0-62 mph in 3.8 seconds. The interior features a minimalist, modern design with a floating 10.25-inch infotainment screen, 7-inch digital instrument cluster, and a clean dashboard layout. Advanced technology includes MG Pilot driver assistance systems with adaptive cruise control, lane keeping assistance, and traffic jam assist. Charging capabilities support up to 135kW DC fast charging, enabling a 10-80% charge in approximately 35 minutes for the long-range version. The MG4 EV became the second best-selling EV in the United Kingdom in 2023."
  - name: "Second Generation (2025)"
    start_year: 2025
    end_year: null
    description: "The second generation MG4 EV represents a completely new platform and design direction. Unveiled in March 2025 with mass production beginning July 14, 2025, this new generation is based on SAIC's E3 electric vehicle architecture using a cell-to-body battery design. Unlike the first generation's rear-wheel drive and all-wheel drive options, this new model is available exclusively in front-wheel drive configuration. The exterior styling incorporates elements from the MG Cyberster while balancing Chinese and international design preferences. Inside, the dashboard features a 15.6-inch 2.5K-resolution central infotainment touchscreen powered by a Qualcomm Snapdragon 8155 SoC, using MG's new operating system co-developed with Oppo. At launch, two LFP battery packs are available with capacities of 42.8 or 54.0 kWh providing CLTC ranges of approximately 310 and 415 km respectively. A semi-solid-state battery option was introduced in late 2025, supplied by QingTao Energy with approximately 70 kWh capacity. Outside China, the model is marketed alongside the rear-wheel drive first generation as the 'MG4 EV Urban'. The second generation received 11,000 refundable deposits within 24 hours of pre-orders opening in August 2025."
